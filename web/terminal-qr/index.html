<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#091324"/>
<title>Lector QR · ET35</title>
<style>
:root{color-scheme:dark;--bg:#091324;--card:#12243b;--line:#33506e;--text:#f0f7ff;--muted:#a9bfd5;--cyan:#67d9e7;--green:#74edaf;--red:#ff9a9f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#153c53 0,#091324 65%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
main{width:min(580px,calc(100% - 28px));padding:25px 0}
.reader{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(17px,4vw,32px);box-shadow:0 24px 65px #040a1c80;text-align:center}
h1{margin:0 0 6px;font-size:clamp(1.35rem,4.5vw,2.1rem);font-weight:750}
.subtitle{color:var(--muted);margin:0 0 24px;font-size:.94rem}
.viewport{position:relative;overflow:hidden;background:#050d19;border:2px solid #365875;border-radius:20px;aspect-ratio:4/3;min-height:240px;display:grid;place-items:center}
#camera{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
#camera[hidden],#camera-status[hidden],#camera-start[hidden]{display:none}
.frame[hidden]{display:none}.frame{position:absolute;inset:19% 22%;border:3px solid var(--cyan);border-radius:18px;box-shadow:0 0 28px #45cde944;pointer-events:none;z-index:1}
.frame::before{content:"";position:absolute;left:8%;right:8%;top:20%;border-top:2px solid #61f0ff86;animation:scan 2.5s ease-in-out infinite alternate}
@keyframes scan{to{top:80%}}
.camera-prompt{position:relative;z-index:2;display:grid;place-items:center;gap:13px;padding:25px}
.camera-prompt .big{font-size:3.1rem;color:var(--cyan)}
.camera-prompt p{margin:0;color:var(--muted);line-height:1.45}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:.92rem;background:var(--cyan);color:#062b39;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#feedback{margin-top:16px;background:#172e48;border:1px solid #39617a;border-radius:14px;min-height:80px;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px;text-align:left}
#feedback .symbol{font-size:1.65rem;flex:none}
#feedback strong{display:block;font-size:1.05rem;margin-bottom:4px}
#feedback small{display:block;color:#c7d8e8;line-height:1.4}
#feedback.success{border-color:#3fbf89;background:#123b34}
#feedback.success strong{color:var(--green)}
#feedback.error{border-color:#b65762;background:#3c2535}
#feedback.error strong{color:var(--red)}
#feedback.pending{border-color:#4388ab}
.field{margin-top:17px;display:block;text-align:left}
.field span{display:block;color:var(--muted);font-size:.82rem;margin-bottom:8px}
#code{width:100%;height:48px;background:#081629;border:1px solid #47718d;border-radius:12px;color:var(--text);font-size:1rem;padding:0 15px;letter-spacing:.02em}
#code::placeholder{color:#9bb0c8}
.hint{margin:9px 0 0;color:var(--muted);font-size:.75rem}
.connection{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:.81rem;margin-top:18px}
.connection i{width:8px;height:8px;border-radius:50%;background:#f3c66f}
.connection.ok i{background:var(--green)}
.connection.off i{background:var(--red)}
@media(max-width:520px){main{width:calc(100% - 16px);padding:8px 0}.reader{border-radius:18px}.viewport{min-height:210px}}
@media(prefers-reduced-motion:reduce){.frame::before{animation:none}}
</style>
</head>
<body>
<main>
 <section class="reader" aria-label="Lector QR de entrada">
  <h1>Escaneá tu código QR</h1>
  <p class="subtitle">ET35 · Registro automático de entrada · Solo datos ficticios</p>
  <div class="viewport">
   <video id="camera" autoplay muted playsinline hidden></video>
   <div class="frame" id="scan-frame" aria-hidden="true" hidden></div>
   <div class="camera-prompt" id="camera-status">
    <span class="big" aria-hidden="true">▣</span>
    <p id="camera-message">Preparando lector QR…</p>
    <button type="button" id="camera-start" hidden>Activar cámara</button>
   </div>
  </div>
  <div id="feedback" role="status" aria-live="polite" aria-atomic="true">
   <div class="symbol">⌛</div><div><strong>Esperando un QR</strong><small>Acercá el código al lector.</small></div>
  </div>
  <label class="field" for="code"><span>O usá un lector USB / ingresá el código QR</span>
   <input id="code" type="text" placeholder="Escaneá el QR y presioná Enter" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="40"/>
  </label>
  <div id="connection" class="connection"><i></i><span>Comprobando los datos escolares…</span></div>
 </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script src="../js/horarios/horarios.js" defer></script>
<script src="../js/conexion/cloud-sync.js" defer></script>
<script src="terminal.js" defer></script>
</body>
</html>
